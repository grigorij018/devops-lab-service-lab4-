name: Lab5 CI/CD UTM

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Build, test and deploy inside CentOS 9 UTM
    runs-on: self-hosted

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          whoami
          hostname
          docker --version
          docker compose version

      - name: Build Docker image
        run: |
          docker build -t devops-lab-service:ci -f docker/Dockerfile .

      - name: Run container for health check
        run: |
          docker rm -f lab5-ci-app || true
          docker run -d --name lab5-ci-app -p 18000:8000 devops-lab-service:ci

          ready=false
          for i in {1..30}; do
            if curl -fsS http://localhost:18000/; then
              ready=true
              break
            fi
            sleep 1
          done

          test "$ready" = true
          curl -fsS http://localhost:18000/metrics | head

      - name: Stop test container
        if: always()
        run: |
          docker rm -f lab5-ci-app || true

      - name: Deploy application over SSH to localhost
        run: |
          set -e
          PROJECT_PATH="$HOME/devops-lab-service-lab4-"
          ssh -o StrictHostKeyChecking=no "$USER@127.0.0.1" "
            set -e
            cd '$PROJECT_PATH'
            git fetch origin '$GITHUB_REF_NAME'
            git checkout '$GITHUB_REF_NAME'
            git pull --ff-only origin '$GITHUB_REF_NAME'
            docker compose up -d --build
            docker compose ps
          "
