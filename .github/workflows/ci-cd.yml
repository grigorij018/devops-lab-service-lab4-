name: Lab5 CI/CD

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Build, test and deploy on CentOS VM
    runs-on: self-hosted

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t devops-lab-service:ci -f docker/Dockerfile .

      - name: Run container for test
        run: |
          docker rm -f lab5-ci-app || true
          docker run -d --name lab5-ci-app -p 18000:8000 devops-lab-service:ci

          ready=false
          for i in {1..30}; do
            if curl -fsS http://localhost:18000/; then
              ready=true
              break
            fi
            sleep 1
          done

          test "$ready" = true
          curl -fsS http://localhost:18000/metrics | head

      - name: Stop test container
        if: always()
        run: |
          docker rm -f lab5-ci-app || true

      - name: Deploy application
        run: |
          cd /home/gr/devops-lab-service-lab4-
          git pull origin master
          docker compose up -d --build
          docker compose ps
