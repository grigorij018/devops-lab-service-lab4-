name: Lab5 CI/CD

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test Docker container
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t devops-lab-service:ci -f docker/Dockerfile .

      - name: Run container
        run: |
          docker run -d --name lab5-ci-app -p 8000:8000 devops-lab-service:ci

          ready=false
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/; then
              ready=true
              break
            fi
            sleep 1
          done

          test "$ready" = true
          curl -fsS http://localhost:8000/metrics | head

      - name: Stop test container
        if: always()
        run: |
          docker rm -f lab5-ci-app || true

  deploy:
    name: Deploy to CentOS VM
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
        run: |
          set -e

          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key

          ssh-keyscan -p "$VM_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/vm_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            "cd '$PROJECT_DIR' && git pull origin '${GITHUB_REF_NAME}' && docker compose up -d --build && docker compose ps"
